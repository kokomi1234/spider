<head data-page-node-id="AmrUzoFps4tuKd4SIGTrxd">
  <meta charset="UTF-8" data-page-node-id="M5EixtJ1FnI9NbKilwfW0V">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" data-page-node-id="EPVPtO1rzFGG0YfcLSKeR2">
  <title>服务发布数据查询</title>
  <link rel="stylesheet" href="theme.css" data-page-node-id="uVYbCompFnKqZLiPKW09ZP">
  <style>
    /* ── 页面专属微调 ─────────────────────────────── */
    .search-bar { display: flex; align-items: flex-end; gap: var(--sp2); flex-wrap: wrap; }
    /* 两行统计卡之间用统一的 16px 节奏，读起来是一组而不是两块 */
    .stat-row { margin-bottom: var(--sp2); }

    /* 结果卡片与筛选卡片同宽（共用 .wrap 的 --page-w）。
       此前用 width:calc(100vw - 48px) + translateX(-50%) 破框居中：
       100vw 含滚动条宽度，一旦页面出现纵向滚动条就会横向溢出，
       且左右边缘与筛选卡片错开。改为统一宽度后两者严格对齐。 */
    .results-card { min-width: 0; }

    /* 查询结果表格：合并重复的编码/接口列，把空间还给重要内容 */
    .result-table {
      /* 列宽集中成变量，窄屏统一压缩，避免整表被挤出横向滚动条 */
      --c-index: 40px;
      --c-code: 270px;
      --c-name: 240px;
      --c-comp: 105px;
      --c-batch: 80px;
      --c-status: 115px;
      --c-check: 82px;
      --c-dept: 175px;
      --c-sub: 100px;
      --c-op: 145px;
      table-layout: fixed;
      width: 100%;
      min-width: calc(var(--c-index) + var(--c-code) + var(--c-name) + var(--c-comp)
                    + var(--c-batch) + var(--c-status) + var(--c-check) + var(--c-dept)
                    + var(--c-sub) + var(--c-op));
      border-collapse: separate;
      border-spacing: 0;
    }
    .result-table th,
    .result-table td {
      overflow: hidden;
      text-overflow: ellipsis;
      padding: 10px 9px;
      font-size: var(--fs-sm);
      border-bottom: 1px solid var(--outline-soft);
    }
    .result-table thead th {
      background: var(--surface-1);
      color: var(--muted);
      font-size: var(--fs-nano);
      font-weight: 600;
      letter-spacing: .02em;
      white-space: nowrap;
      position: sticky;
      top: 0;
      z-index: 1;
    }
    .result-table tbody td {
      vertical-align: middle;
      white-space: normal;
      word-break: break-word;
      line-height: 1.4;
    }
    .result-table tbody tr:last-child td { border-bottom: none; }
    .result-table tbody tr:hover td { background: var(--surface-1); }
    /* 操作列固定在可视区域右侧，横向空间不足时“详情/订阅”仍然可见 */
    .result-table thead th:last-child,
    .result-table tbody td:last-child {
      position: sticky;
      right: 0;
      z-index: 2;
      box-shadow: -6px 0 8px -8px rgba(26, 28, 30, .45);
    }
    .result-table thead th:last-child {
      z-index: 3;
      background: var(--surface-1);
    }
    .result-table tbody td:last-child { background: var(--surface); }
    .result-table tbody tr.unsubscribed-row td:last-child {
      background: color-mix(in srgb, var(--amber-c) 30%, var(--surface));
    }
    .result-table tbody tr:hover td:last-child,
    .result-table tbody tr.unsubscribed-row:hover td:last-child {
      background: var(--surface-1);
    }
    .result-table td[colspan] { text-align: center; padding: 40px 0; color: var(--muted); }

    /* 宽屏优先展示服务名/接口名；低信息量列保持紧凑 */
    .result-table .col-index  { width: var(--c-index); }
    .result-table .col-code   { width: var(--c-code); }
    .result-table .col-name   { width: var(--c-name); }
    .result-table .col-comp   { width: var(--c-comp); }
    .result-table .col-batch  { width: var(--c-batch); }
    .result-table .col-status { width: var(--c-status); }
    .result-table .col-check  { width: var(--c-check); }
    .result-table .col-dept   { width: var(--c-dept); }
    .result-table .col-sub    { width: var(--c-sub); }
    .result-table .col-op     { width: var(--c-op); }

    /* 窄屏（≤1460px）：按信息密度等比压缩列宽，总宽 1160px，
       1280 / 1366 / 1440 这些常见分辨率下都不再出现横向滚动条 */
    @media (max-width: 1460px) {
      .result-table {
        --c-code: 224px;
        --c-name: 196px;
        --c-comp: 90px;
        --c-batch: 76px;
        --c-status: 100px;
        --c-check: 78px;
        --c-dept: 134px;
        --c-sub: 92px;
        --c-op: 136px;
      }
    }

    .result-table .cell-code,
    .result-table .cell-comp {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: var(--fs-nano);
      white-space: normal;
      word-break: break-all;
    }
    .result-table .cell-code {
      line-height: 1.35;
    }
    .result-table .cell-primary-code,
    .result-table .cell-secondary-code {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: normal;
      overflow-wrap: anywhere;
    }
    .result-table .cell-primary-code {
      color: var(--on-surface);
      font-weight: 600;
    }
    .result-table .cell-secondary-code {
      margin-top: 3px;
      color: var(--muted);
      font-family: inherit;
      font-size: var(--fs-nano);
    }
    .result-table .cell-secondary-code.is-same {
      color: var(--faint);
      font-family: inherit;
    }
    .result-table .cell-clamp {
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      overflow: hidden;
    }
    .result-table .cell-status,
    .result-table .cell-check,
    .result-table .cell-sub {
      text-align: center;
      white-space: nowrap;
    }
    .result-table .col-op {
      text-align: center;
      white-space: nowrap;
    }
    .result-table .col-op .text-btn {
      padding: 3px 7px;
      min-height: 25px;
      font-size: var(--fs-nano);
    }
    .result-table .col-op .action-row {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 2px;
    }
    .result-table .col-op .action-row .btn-subscribe {
      color: var(--on-amber-c);
    }

    /* 结果条数靠左、导出/筛选按钮组靠右，中间留白 */
    .results-card .card-head .toolbar { flex: 1 1 auto; justify-content: flex-end; }
    .result-count {
      font-size: var(--fs-sm);
      color: var(--muted);
      margin-right: auto;
    }

    /* 订阅筛选按钮组（外观与全站胶囊按钮一致，颜色走主题变量） */
    .subscribe-filter-group {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .subscribe-filter-group button {
      padding: 4px 12px;
      font-size: var(--fs-xs);
      min-height: 30px;
      border-radius: var(--r-pill);
      border: 1px solid var(--outline);
      background: var(--surface);
      color: var(--on-variant);
      cursor: pointer;
      font-family: inherit;
      transition: background .15s, border-color .15s, color .15s;
    }
    .subscribe-filter-group button:hover {
      border-color: var(--primary);
      color: var(--primary);
    }
    .subscribe-filter-group button.active {
      background: var(--primary);
      color: var(--on-primary);
      border-color: var(--primary);
    }

    /* 表格视口限高：thead 的 position:sticky 只有在滚动容器里才生效，
       此前没有高度约束，一页 50 行会把分页条顶到屏幕外。
       限高后表头吸顶、分页条常驻可见，长列表不用反复上下滚页面。 */
    .tbl-scroll {
      overflow: auto;
      overscroll-behavior-x: contain;
      max-height: clamp(320px, 68vh, 820px);
      border: 1px solid var(--outline-soft);
      border-radius: var(--r-sm);
      background: var(--surface);
      scrollbar-width: thin;
      scrollbar-color: var(--outline) transparent;
    }
    /* 空状态时不留一大块空白 */
    .tbl-scroll:has(tbody tr:only-child td[colspan]) { max-height: none; }
    .tbl-scroll::-webkit-scrollbar { height: 8px; }
    .tbl-scroll::-webkit-scrollbar-thumb {
      background: var(--outline);
      border-radius: var(--r-pill);
    }
    .tbl-scroll::-webkit-scrollbar-track { background: transparent; }

    /* 部门下拉的标题行：标签 + 上下页 */
    .dept-label {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 6px;
    }
    .dept-label label { margin: 0; }
    .field-note {
      display: block;
      margin-top: 4px;
      font-size: var(--fs-nano);
      color: var(--muted);
    }

    /* 必填项星号 */
    .required::before {
      content: '*';
      color: #e53e3e;
      margin-right: 4px;
      font-weight: bold;
    }

    /* 详情弹窗 */
    #detailDialog { max-width: 640px; }
    /* 详情状态行：接口加载中 / 失败回退本地时的提示 */
    .detail-status {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: calc(var(--sp2) * -1) 0 var(--sp2);
      font-size: var(--fs-xs);
      color: var(--muted);
      min-height: 0;
    }
    .detail-status[hidden] { display: none; }
    .detail-status.is-loading::before {
      content: '';
      width: 13px;
      height: 13px;
      border: 2px solid var(--outline);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin .6s linear infinite;
      flex-shrink: 0;
    }
    .detail-status.is-error {
      color: var(--on-red-c);
      background: color-mix(in srgb, var(--red-c) 55%, transparent);
      padding: 6px 10px;
      border-radius: var(--r-xs);
    }
    .detail-body {
      max-height: 60vh;
      overflow-y: auto;
      display: grid;
      grid-template-columns: 168px 1fr;
      gap: 1px;
      background: var(--outline-soft);
      border: 1px solid var(--outline-soft);
      border-radius: var(--r-xs);
      font-size: var(--fs-md);
    }
    .detail-body dt, .detail-body dd {
      background: var(--surface);
      padding: 7px 12px;
      word-break: break-all;
    }
    .detail-body dt { color: var(--muted); font-size: var(--fs-sm); }
    .detail-body dd { font-family: monospace; font-size: var(--fs-xs); }
    .detail-body .empty { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 24px 0; }

    /* 订阅弹窗 / 关联文档子弹窗的样式统一放在 theme.css 的「订阅弹窗」小节。
       之前内联在这里时用了 #subscribeOverlay / #subscribeDialog 这类 ID 选择器，
       优先级高于 theme.css 的 .sub-* 类规则，改主题改不动，所以整体迁出。 */
  </style>
</head>
