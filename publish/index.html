<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ITAMP 数据查询 — 首页</title>
  <link rel="stylesheet" href="theme.css">
  <style>
    /* ── 首页专属版式（令牌与组件类一律复用 theme.css）───────── */

    /* 入口卡：三张等宽卡片，窄屏自动换行 */
    .home-entries {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: var(--sp2);
      margin-bottom: var(--sp3, var(--sp2));
    }
    @media (max-width: 1080px) {
      .home-entries { grid-template-columns: 1fr; }
    }

    /* 单张入口卡：整体可点击，hover 有反馈，键盘可达（a 标签自带） */
    .home-entry {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: var(--sp2);
      background: var(--surface);
      border: 1px solid var(--outline-soft);
      border-radius: var(--r-sm);
      text-decoration: none;
      color: inherit;
      transition: border-color .15s, box-shadow .15s, transform .15s;
    }
    .home-entry:hover,
    .home-entry:focus-visible {
      border-color: var(--primary);
      box-shadow: 0 2px 10px rgba(26, 28, 30, .08);
      transform: translateY(-1px);
    }
    .home-entry:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    .home-entry .entry-idx {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border-radius: var(--r-pill);
      background: var(--primary-c);
      color: var(--on-primary-c);
      font-size: var(--fs-nano);
      font-weight: 600;
      flex-shrink: 0;
    }
    .home-entry .entry-head { display: flex; align-items: center; gap: 10px; }
    .home-entry .entry-title { font-size: var(--fs-lg); font-weight: 600; margin: 0; }
    .home-entry .entry-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .home-entry .entry-meta li {
      font-size: var(--fs-nano);
      color: var(--on-variant);
      background: var(--surface-1);
      border-radius: var(--r-pill);
      padding: 3px 9px;
    }
    .home-entry .entry-go {
      margin-top: auto;
      font-size: var(--fs-sm);
      color: var(--primary);
      font-weight: 600;
    }

    /* 常用查询列表 */
    .saved-list { display: grid; gap: 8px; }
    .saved-item {
      display: flex;
      align-items: stretch;
      gap: 0;
      border: 1px solid var(--outline-soft);
      border-radius: var(--r-xs);
      background: var(--surface);
      overflow: hidden;
    }
    .saved-item:hover { border-color: var(--outline); background: var(--surface-1); }
    /* 主体整块可点：撑满左侧，命中区就是「这一栏」本身，不用单独摆一个打开按钮 */
    .saved-item .saved-main {
      flex: 1 1 auto;
      min-width: 0;
      display: block;
      padding: 10px 12px;
      color: inherit;
      text-decoration: none;
    }
    .saved-item .saved-main:hover { text-decoration: none; }
    .saved-item .saved-main:hover .saved-name { color: var(--primary); }
    .saved-item .saved-main:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: -2px;
    }
    .saved-item .saved-name {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: var(--fs-md);
      font-weight: 600;
      color: var(--on-surface);
      word-break: break-all;
    }
    .saved-item .saved-badge {
      flex-shrink: 0;
      font-size: var(--fs-nano);
      color: var(--on-primary-c);
      background: var(--primary-c);
      border-radius: var(--r-pill);
      padding: 2px 8px;
      font-weight: 500;
    }
    .saved-item .saved-summary,
    .saved-item .saved-meta {
      margin-top: 3px;
      font-size: var(--fs-nano);
      color: var(--muted);
      word-break: break-all;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      overflow: hidden;
    }
    /* 操作区贴在右侧，独立于可点主体（按钮不能嵌在 <a> 里） */
    .saved-item .saved-ops {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      padding: 10px 12px;
    }

    /* 同步状态角标：告诉用户「现在看的是团队库还是只有本机这一份」。
       ⚠️ display 会把 hidden 属性盖掉（类选择器优先于 UA 样式），所以必须补 [hidden] 那条 */
    .sync-state {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: var(--fs-nano);
      line-height: 1.6;
      border-radius: var(--r-pill);
      padding: 2px 9px;
      border: 1px solid var(--outline-soft);
      background: var(--surface-1);
      /* --muted 对 --surface-1 只有 4.08:1，12px 小字不过 WCAG AA；这页本来就在用 --on-variant */
      color: var(--on-variant);
      cursor: default;
      white-space: nowrap;
    }
    .sync-state[hidden] { display: none; }
    .sync-state::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      flex-shrink: 0;
    }
    .sync-state.is-shared { color: var(--ok-ink); border-color: currentColor; }
    .sync-state.is-local { color: var(--on-variant); border-color: currentColor; }
    .sync-state.is-fail { color: var(--warn-ink); border-color: currentColor; }
    /* 连上了共享库、但「当前用户」缺工号或部门：这种身份存的东西换台机器对不上，
       角标要单独一档（「身份不全」），不能混在「已同步」里骗人（2026-09-23） */
    .sync-state.is-incomplete { color: var(--warn-ink); border-color: currentColor; }

    /* 当前用户
       ⚠️ 这几条 [hidden] 规则不能省：下面的 display:flex 会盖掉 hidden 属性自带的
       display:none（类选择器优先于 UA 样式），未设置时「切换用户」按钮会漏出来、
       设置完输入框也不消失（2026-09-19 截图复核过）。 */
    .home-user[hidden],
    .home-user-form[hidden] { display: none; }

    .home-user { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    /* 头像圈：姓名首字，一眼看出「这条是我」 */
    .home-user .user-avatar {
      flex-shrink: 0;
      width: 38px;
      height: 38px;
      border-radius: var(--r-pill);
      background: var(--primary-c);
      color: var(--on-primary-c);
      font-size: var(--fs-lg);
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .home-user .user-info { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
    .home-user .user-name {
      font-size: var(--fs-md);
      font-weight: 600;
      color: var(--on-surface);
      word-break: break-all;
    }
    .home-user .user-dept {
      font-size: var(--fs-nano);
      color: var(--muted);
      word-break: break-all;
    }
    /* 「切换用户」跟着身份条走，不推到卡片最右边 —— 卡片全宽时会把按钮甩出老远 */
    .home-user #btnUserChange { margin-left: 4px; }

    /* 输入组：label 在上、控件定宽在下，和查询页筛选区同一套语言。
       原来输入框 flex:1 撑满 1100+px，和按钮离得太远，整行都是散的。 */
    .home-user-form { display: flex; align-items: flex-end; gap: 8px; flex-wrap: wrap; }
    /* 宽度给宿主容器：组件自己的 .searchable-select 是 width:100%，
       所以「多宽」由这里决定（与旧的 300px 输入框对齐） */
    .home-field { display: flex; flex-direction: column; gap: 6px; width: 300px; max-width: 100%; }
    .home-field-label {
      font-size: var(--fs-nano);
      font-weight: 600;
      color: var(--muted);
      letter-spacing: .02em;
    }
    /* （2026-09-20）原来这里有一整套自写的输入框 + ✕ 按钮样式（.home-input-wrap /
       .home-input / .home-input-clear）。「当前用户」改用 js/ui/searchable-select.js 之后，
       输入框、✕、▼、下拉面板都由组件自己建，样式走 theme.css 的 .searchable-select 系列，
       这一套不再需要，已删。 */
    /* 窄屏：输入框跟按钮各占一行，不挤成半截 */
    @media (max-width: 560px) {
      .home-user-form { align-items: stretch; }
      .home-field { width: 100%; }
      .home-user-form #btnUserSearch { width: 100%; }
    }

    /* （2026-09-20）原来这里有一整套自写的候选项样式（.home-user-cands / .cand 系列）。
       「当前用户」改用 js/ui/searchable-select.js 之后，面板与选项都由组件自己渲染
       （.searchable-select-dropdown / .searchable-select-option，样式在 theme.css），已删。 */

    /* 部门排行：条数切换 */
    .dept-topn { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-xs); color: var(--muted); }
    .dept-topn select {
      padding: 4px 8px;
      font-size: var(--fs-xs);
      font-family: inherit;
      color: var(--on-surface);
      background: var(--surface);
      border: 1px solid var(--outline);
      border-radius: var(--r-xs);
      min-height: 30px;
    }

    .home-empty {
      padding: 22px 0;
      text-align: center;
      color: var(--muted);
      font-size: var(--fs-sm);
      line-height: 1.6;
    }
    .home-note {
      margin-top: var(--sp2);
      color: var(--faint);
      font-size: var(--fs-nano);
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="wrap">

    <!-- ═══ 页面标题 ═══ -->
    <div class="page-header">
      <h1>ITAMP 数据查询</h1>
      <div class="toolbar">
        <button class="outlined btn-sm" id="btnTokenManager">🔑 Token</button>
      </div>
    </div>

    <!-- ═══ 三个页面入口 ═══ -->
    <div class="home-entries">
      <a class="home-entry" id="entryPublish" href="/publish">
        <div class="entry-head">
          <span class="entry-idx">1</span>
          <h2 class="entry-title">服务发布数据查询</h2>
        </div>
        <ul class="entry-meta">
          <li>服务 / 接口检索</li>
          <li>订阅与评委信息</li>
          <li>CSV 导出</li>
        </ul>
        <span class="entry-go">进入 →</span>
      </a>

      <a class="home-entry" id="entryTask" href="/task">
        <div class="entry-head">
          <span class="entry-idx">2</span>
          <h2 class="entry-title">任务单查询</h2>
        </div>
        <ul class="entry-meta">
          <li>任务单检索</li>
          <li>详情查看</li>
          <li>CSV 导出</li>
        </ul>
        <span class="entry-go">进入 →</span>
      </a>

      <a class="home-entry" id="entrySubscription" href="/subscription">
        <div class="entry-head">
          <span class="entry-idx">3</span>
          <h2 class="entry-title">服务订阅关系查询</h2>
        </div>
        <ul class="entry-meta">
          <li>订阅关系检索</li>
          <li>投产优先级</li>
          <li>批次时间维护</li>
        </ul>
        <span class="entry-go">进入 →</span>
      </a>
    </div>

    <!-- ═══ 当前用户（查询人）═══ -->
    <div class="card" id="userCard">
      <div class="card-head">
        <h2>当前用户</h2>
        <span class="result-count" id="userHint" aria-live="polite"></span>
      </div>
      <div class="card-body">
        <!-- 已设置：身份条（头像 + 姓名工号 + 部门），比原来一行纯文本好扫读 -->
        <div class="home-user" id="userSet" hidden>
          <span class="user-avatar" id="userAvatar" aria-hidden="true"></span>
          <span class="user-info">
            <span class="user-name" id="userLabel"></span>
            <span class="user-dept" id="userDept"></span>
          </span>
          <button type="button" class="outlined btn-xs" id="btnUserChange">切换用户</button>
        </div>

        <!-- 未设置：定宽输入组（对齐查询页「label + 控件」的版式，不再撑满整行） -->
        <div class="home-user-form" id="userForm">
          <!-- 当前用户用项目统一的可搜索下拉（js/ui/searchable-select.js）：
               输入即出候选、↑↓ 选、Enter 确认、Esc 关掉 —— 键盘与无障碍口径和别的页只有一份。
               这个 <select> 会被组件隐藏并接管（它自己在父节点里插入 .searchable-select 结构）。 -->
          <label class="home-field" for="userKeyword">
            <span class="home-field-label">工号或姓名</span>
            <select id="userKeyword"></select>
          </label>
          <button type="button" class="filled btn-sm" id="btnUserSearch">查 询</button>
        </div>
      </div>
    </div>

    <!-- ═══ 常用查询（快捷入口）═══ -->
    <div class="card">
      <div class="card-head">
        <h2 id="savedTitle">我的常用查询</h2>
        <div class="toolbar">
          <span class="result-count" id="savedCount" aria-live="polite"></span>
          <!-- 同步是静默的（失败就退回本机），所以把这个状态显式摆出来。
               数据来自 SavedQuery.lastSyncState()，代理响应里的 file 就是它实际读写的库文件 -->
          <span class="sync-state is-local" id="savedSync" aria-live="polite" hidden></span>
          <!-- 列表按「当前用户」过滤（服务端 ?user=<工号>，回落本机镜像），所以换人就会换列表；
               导出/导入走的是**共享库**（连不上代理才退本机镜像），不按人切 -->
          <button type="button" class="outlined btn-xs" id="btnExportQueries">导 出</button>
          <button type="button" class="outlined btn-xs" id="btnImportQueries">导 入</button>
        </div>
      </div>
      <div class="card-body">
        <div class="saved-list" id="savedList"></div>
        <div class="home-empty" id="savedEmpty" hidden>
          还没有保存的常用查询。<br>
          到任一查询页填好筛选条件后，点筛选区的「⭐ 保存到首页」，这里就会出现一键直达的入口。
        </div>
      </div>
    </div>

    <!-- ═══ 部门常用查询（排行：同一份条件被本部门几个人保存过，数据来自共享库）═══ -->
    <div class="card" id="deptCard">
      <div class="card-head">
        <h2 id="deptTitle">部门常用查询</h2>
        <div class="toolbar">
          <label class="dept-topn" for="deptTopN">显示
            <select id="deptTopN">
              <option value="5">5 条</option>
              <option value="10" selected>10 条</option>
              <option value="20">20 条</option>
            </select>
          </label>
        </div>
      </div>
      <div class="card-body">
        <div class="saved-list" id="deptList"></div>
        <div class="home-empty" id="deptEmpty" hidden></div>
      </div>
    </div>

  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!--
    首页依赖很轻，但顺序仍按项目约定：
      debug.js 早于其它；saved-query.js 主存是代理的共享库（本机 localStorage 只是离线镜像）；
      bootstrap.js 做依赖检查与全局异常兜底；home.js 最后装配。
  -->
  <script src="js/core/runtime-config.js"></script>
  <script src="js/core/debug.js"></script>
  <script src="js/core/format.js"></script>
  <script src="js/ui/popup-position.js"></script>
  <!-- 「当前用户」的可搜索下拉用它（组件在这个 <select> 的原位置建输入框 + 面板） -->
  <script src="js/ui/searchable-select.js"></script>
  <script src="js/ui/dialog-utils.js"></script>
  <script src="js/ui/toast.js"></script>
  <script src="js/ui/token-manager.js"></script>
  <script src="js/core/user-token.js"></script>
  <script src="js/core/api-client.js"></script>
  <script src="js/api/user-api.js"></script>
  <script src="js/ui/current-user.js"></script>
  <script src="js/ui/saved-query.js"></script>
  <script src="js/core/bootstrap.js"></script>
  <script src="js/page/home.js"></script>
</body>
</html>
