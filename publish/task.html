<head data-page-node-id="ndfITAf2z71EGVQb1TI5xD">
  <meta charset="UTF-8" data-page-node-id="LAnBkEnRqwtpaz8CXIltCv">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" data-page-node-id="35HhYp44qzaA9xoLJ3pjJs">
  <title>任务单查询</title>
  <link rel="stylesheet" href="theme.css" data-page-node-id="05I6BsQeQaAjh8jkZyht5E">
  <style>
    /* ── 页面专属微调（与弹窗无关，弹窗样式一律在 theme.css）── */

    /* 结果条数说明（与首页 #resultCount 同款） */
    .result-count { font-size: var(--fs-xs); color: var(--muted); margin-right: var(--sp1); }

    /* 结果表格：列宽集中成变量，窄屏统一压缩 */
    .task-table {
      --c-index: 40px;
      --c-no: 130px;
      --c-name: 280px;
      --c-type: 80px;
      --c-dept: 170px;
      --c-demand: 130px;
      --c-prod: 110px;
      --c-rel: 190px;
      --c-batch: 80px;
      --c-state: 90px;
      --c-perf: 90px;
      --c-date: 120px;
      --c-op: 76px;
      table-layout: fixed;
      width: 100%;
      min-width: calc(var(--c-index) + var(--c-no) + var(--c-name) + var(--c-type)
                    + var(--c-dept) + var(--c-demand) + var(--c-prod) + var(--c-rel)
                    + var(--c-batch) + var(--c-state) + var(--c-perf) + var(--c-date)
                    + var(--c-op));
      border-collapse: separate;
      border-spacing: 0;
    }
    .task-table th,
    .task-table td {
      overflow: hidden;
      text-overflow: ellipsis;
      padding: 10px 9px;
      font-size: var(--fs-sm);
      border-bottom: 1px solid var(--outline-soft);
    }
    .task-table thead th {
      background: var(--surface-1);
      color: var(--muted);
      font-size: var(--fs-nano);
      font-weight: 600;
      letter-spacing: .02em;
      white-space: nowrap;
      position: sticky;
      top: 0;
      z-index: 1;
    }
    .task-table tbody td {
      vertical-align: middle;
      white-space: normal;
      word-break: break-word;
      line-height: 1.4;
    }
    .task-table tbody tr:last-child td { border-bottom: none; }
    .task-table tbody tr:hover td { background: var(--surface-1); }
    /* 操作列固定在可视区域右侧 */
    .task-table thead th:last-child,
    .task-table tbody td:last-child {
      position: sticky;
      right: 0;
      z-index: 2;
      box-shadow: -6px 0 8px -8px rgba(26, 28, 30, .45);
    }
    .task-table thead th:last-child { z-index: 3; background: var(--surface-1); }
    .task-table tbody td:last-child { background: var(--surface); }
    .task-table tbody tr:hover td:last-child { background: var(--surface-1); }
    .task-table td[colspan] { text-align: center; padding: 40px 0; color: var(--muted); }

    .task-table .col-index  { width: var(--c-index); }
    .task-table .col-no     { width: var(--c-no); }
    .task-table .col-name   { width: var(--c-name); }
    .task-table .col-type   { width: var(--c-type); }
    .task-table .col-dept   { width: var(--c-dept); }
    .task-table .col-demand { width: var(--c-demand); }
    .task-table .col-prod   { width: var(--c-prod); }
    .task-table .col-rel    { width: var(--c-rel); }
    .task-table .col-batch  { width: var(--c-batch); }
    .task-table .col-state  { width: var(--c-state); }
    .task-table .col-perf   { width: var(--c-perf); }
    .task-table .col-date   { width: var(--c-date); }
    .task-table .col-op     { width: var(--c-op); }

    @media (max-width: 1460px) {
      .task-table {
        --c-no: 118px;
        --c-name: 216px;
        --c-type: 72px;
        --c-dept: 138px;
        --c-demand: 116px;
        --c-prod: 96px;
        --c-rel: 140px;
        --c-batch: 74px;
        --c-state: 80px;
        --c-perf: 80px;
        --c-date: 104px;
        --c-op: 72px;
      }
    }

    .task-table .cell-no,
    .task-table .cell-demand,
    .task-table .cell-prod {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: var(--fs-nano);
    }
    .task-table .cell-rel { font-size: var(--fs-nano); color: var(--on-variant); }
    .task-table .cell-name { font-weight: 500; }

    /* 「更多筛选项」折叠头 .more-head 已上提到 theme.css（两页共用） */

    /* 日期区间：起 ~ 止 两个输入框并排 */
    .date-range { display: flex; align-items: center; gap: 6px; }
    .date-range input { flex: 1 1 0; min-width: 0; }
    .date-range span { color: var(--faint); font-size: var(--fs-xs); }

    /* 多选控件 .msel 的样式已上提到 theme.css（两页共用），这里不再重复 */
    /* 详情弹窗：任务单字段多，做成两列网格。宽度由 theme.css 的 .dialog--lg 提供，
       页面里不再用 ID 选择器覆盖 max-width（ID 权重高于 class，会让全局调整改不动） */
    .task-detail-body {
      max-height: 62vh;
      overflow-y: auto;
      display: grid;
      grid-template-columns: 190px 1fr;
      gap: 1px;
      background: var(--outline-soft);
      border: 1px solid var(--outline-soft);
      border-radius: var(--r-xs);
      font-size: var(--fs-md);
    }
    .task-detail-body dt,
    .task-detail-body dd { background: var(--surface); padding: 7px 12px; word-break: break-all; }
    .task-detail-body dt { color: var(--muted); font-size: var(--fs-sm); }
    .task-detail-body dd { font-family: monospace; font-size: var(--fs-xs); }
    .task-detail-body .empty { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 24px 0; }
  </style>
</head>
