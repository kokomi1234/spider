<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>批次下拉测试</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; padding: 40px; }
    .container { max-width: 600px; margin: 0 auto; }
    h1 { color: #333; }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-weight: 600; color: #555; }
    .result { margin-top: 20px; padding: 16px; background: #f5f5f5; border-radius: 8px; }
    button { padding: 10px 20px; background: #1976d2; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background: #1565c0; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🧪 批次下拉选择器测试</h1>
    
    <div class="form-group">
      <label for="f_prodBatch">提供方最新变更批次（可搜索）</label>
      <select id="f_prodBatch" placeholder="请输入或选择批次"></select>
    </div>
    
    <button onclick="testLoad()">加载真实批次数据</button>
    <button onclick="loadMockData()">加载模拟数据</button>
    
    <div class="result" id="result">
      <p>点击按钮测试...</p>
    </div>
  </div>

  <script src="api-client.js"></script>
  <script src="batch-data.js"></script>
  <script src="searchable-select.js"></script>
  
  <script>
    let batchSelectInstance = null;
    const resultEl = document.getElementById('result');
    
    function showResult(msg) {
      resultEl.innerHTML = msg;
    }
    
    async function testLoad() {
      try {
        showResult('<p>🔄 加载中...</p>');
        const batches = await window.loadBatchList();
        console.log('批次数据:', batches);
        
        if (typeof window.createSearchableSelect === 'function') {
          batchSelectInstance = window.createSearchableSelect(
            document.getElementById('f_prodBatch'), 
            batches
          );
          showResult(`
            <p>✅ 批次列表加载成功！共 <strong>${batches.length}</strong> 个批次</p>
            <p><small>试试在输入框中搜索，比如输入 "2606" 或 "独立"</small></p>
          `);
        } else {
          showResult('<p>❌ searchable-select.js 未正确加载</p>');
        }
      } catch (err) {
        showResult(`<p style="color: red;">❌ 加载失败: ${err.message}</p>`);
      }
    }
    
    function loadMockData() {
      const mockBatches = [
        { label: '2606批次', value: '2606' },
        { label: '26年8月独立', value: '268dl' },
        { label: '24年7月独立', value: '344' },
        { label: '2404批次', value: '2404' },
        { label: '2401批次', value: '332' },
        { label: '27年3月独立', value: '273dl' },
        { label: '2608批次', value: '2608' },
        { label: '2607批次', value: '2607' },
        { label: '2511批次', value: '2511' },
        { label: '2412批次', value: '2412' },
        { label: '2605批次', value: '2605' },
        { label: '24年3月独立', value: '340' },
      ];
      
      batchSelectInstance = window.createSearchableSelect(
        document.getElementById('f_prodBatch'), 
        mockBatches
      );
      
      showResult(`
        <p>✅ 模拟数据加载成功！共 <strong>${mockBatches.length}</strong> 个批次</p>
        <p><small>试试在输入框中搜索</small></p>
      `);
    }
    
    // 页面加载完成后自动加载模拟数据
    window.addEventListener('DOMContentLoaded', () => {
      loadMockData();
    });
  </script>
</body>
</html>
